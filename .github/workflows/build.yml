name: Build and verify Xiaote

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The build cache belongs to one physical Mac, so never let two app builds
  # modify it at the same time.
  group: xiaote-mac
  cancel-in-progress: true

jobs:
  test-backend:
    name: Fleet API backend tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Test and vet backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

  test-library:
    name: Tesla protocol tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Checkout pinned app TeslaBLEKeyKit fork
        uses: actions/checkout@v6
        with:
          repository: zwthys-cyber/TeslaBLEKeyKit
          ref: d5da62c003ac6e2e0d8695f910957dd5708c82d7
          path: .ci/TeslaBLEKeyKit

      - name: Run protocol and crypto tests
        working-directory: .ci/TeslaBLEKeyKit
        run: swift test

  build-app:
    name: Build unsigned TrollStore IPA
    # Never execute pull-request code on a persistent personal Mac.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, xiaote-mac]
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
        run: |
          if command -v xcodegen >/dev/null && \
             xcodegen --version | grep -q "$XCODEGEN_VERSION"; then
            echo "Using installed XcodeGen $XCODEGEN_VERSION"
            exit 0
          fi
          tool_dir="$RUNNER_TOOL_CACHE/xiaote/xcodegen/$XCODEGEN_VERSION"
          if [ ! -x "$tool_dir/xcodegen/bin/xcodegen" ]; then
            mkdir -p "$tool_dir"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --http1.1 \
              "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
              --output "$RUNNER_TEMP/xcodegen.zip"
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$tool_dir"
          fi
          echo "$tool_dir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Prepare persistent build caches
        run: |
          mkdir -p \
            "$RUNNER_TOOL_CACHE/xiaote/SourcePackages" \
            "$RUNNER_TOOL_CACHE/xiaote/DerivedData"

      - name: Verify Mac toolchain
        run: |
          xcodebuild -version
          xcodegen --version
          swift --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3 4 5; do
            if xcodebuild -resolvePackageDependencies \
              -project Xiaote.xcodeproj \
              -scheme Xiaote \
              -clonedSourcePackagesDirPath "$RUNNER_TOOL_CACHE/xiaote/SourcePackages"; then
              exit 0
            fi
            echo "Swift package resolution attempt $attempt failed; retrying"
          done
          exit 1

      - name: Prepare reproducible simulator devices
        run: python3 scripts/prepare-ios-simulators.py

      - name: Run app and UI regression tests
        run: |
          xcodebuild test \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -destination "platform=iOS Simulator,id=$UI_PHONE_ID" \
            -derivedDataPath "$RUNNER_TOOL_CACHE/xiaote/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TOOL_CACHE/xiaote/SourcePackages" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify compact iPhone UI
        run: |
          xcodebuild test \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -destination "platform=iOS Simulator,id=$UI_SMALL_PHONE_ID" \
            -derivedDataPath "$RUNNER_TOOL_CACHE/xiaote/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TOOL_CACHE/xiaote/SourcePackages" \
            -resultBundlePath SmallScreenResults.xcresult \
            -only-testing:XiaoteUITests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path build/ui-screenshots
          fi
          if [ -d SmallScreenResults.xcresult ]; then
            xcrun xcresulttool export attachments --path SmallScreenResults.xcresult --output-path build/ui-screenshots-small
          fi

      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Xiaote-Simulator-Results
          path: |
            TestResults.xcresult
            SmallScreenResults.xcresult
            build/ui-screenshots
            build/ui-screenshots-small
          retention-days: 7

      - name: Build for physical iPhone without signing
        run: |
          xcodebuild \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TOOL_CACHE/xiaote/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TOOL_CACHE/xiaote/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package TrollStore IPA
        run: |
          mkdir -p build/Payload
          cp -R "$RUNNER_TOOL_CACHE/xiaote/DerivedData/Build/Products/Release-iphoneos/Xiaote.app" build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/Xiaote-unsigned.ipa
          (cd build && shasum -a 256 Xiaote-unsigned.ipa > Xiaote-unsigned.ipa.sha256)

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Xiaote-iOS17-TrollStore
          path: |
            build/Xiaote-unsigned.ipa
            build/Xiaote-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            build/Xiaote-unsigned.ipa \
            build/Xiaote-unsigned.ipa.sha256 \
            --clobber
