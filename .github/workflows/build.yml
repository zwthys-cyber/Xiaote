name: Build and verify Xiaote

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    name: Fleet API backend tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Test and vet backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

  test-library:
    name: Tesla protocol tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Run protocol and crypto tests
        working-directory: Vendor/TeslaBLEKeyKit
        run: swift test

  build-app:
    name: Build unsigned TrollStore IPA
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    concurrency:
      # Latest push wins; a superseded app build only burns minutes.
      group: xiaote-app-build
      cancel-in-progress: true
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify Mac toolchain
        run: |
          xcodebuild -version
          xcodegen --version
          swift --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3 4 5; do
            if xcodebuild -resolvePackageDependencies \
              -project Xiaote.xcodeproj \
              -scheme Xiaote \
              -clonedSourcePackagesDirPath SourcePackages; then
              exit 0
            fi
            echo "Swift package resolution attempt $attempt failed; retrying"
            # A mirror left by the deleted fork can hold commits without their
            # trees, and the runner proxy can drop connections mid-fetch. Clear
            # both caches so the next attempt clones cleanly.
            rm -rf SourcePackages
            rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/TeslaBLEKeyKit-*
          done
          exit 1

      - name: Prepare reproducible simulator devices
        run: python3 scripts/prepare-ios-simulators.py

      - name: Require simulator validation
        run: test "$CAN_RUN_UI_TESTS" = "true"

      - name: Run app and UI regression tests
        run: |
          # A previous run on this persistent runner can leave its bundle
          # behind; xcodebuild refuses to overwrite an existing result path.
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -destination "platform=iOS Simulator,id=$UI_PHONE_ID" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO

      - name: Verify compact iPhone UI
        run: |
          # Same rationale as the main regression bundle above.
          rm -rf SmallScreenResults.xcresult
          xcodebuild test \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -destination "platform=iOS Simulator,id=$UI_SMALL_PHONE_ID" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath SmallScreenResults.xcresult \
            -only-testing:XiaoteUITests \
            -parallel-testing-enabled NO

      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path build/ui-screenshots
          fi
          if [ -d SmallScreenResults.xcresult ]; then
            xcrun xcresulttool export attachments --path SmallScreenResults.xcresult --output-path build/ui-screenshots-small
          fi

      - name: Upload simulator results
        id: simulator_upload
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Xiaote-Simulator-Results
          path: |
            TestResults.xcresult
            SmallScreenResults.xcresult
            build/ui-screenshots
            build/ui-screenshots-small
          retention-days: 7

      - name: Upload UI screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Xiaote-UI-Screenshots
          path: |
            build/ui-screenshots
            build/ui-screenshots-small
          if-no-files-found: warn
          retention-days: 14

      - name: Retry simulator results upload
        if: always() && steps.simulator_upload.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Xiaote-Simulator-Results-Retry
          path: |
            TestResults.xcresult
            SmallScreenResults.xcresult
            build/ui-screenshots
            build/ui-screenshots-small
          retention-days: 7

      - name: Build for physical iPhone without signing
        run: |
          xcodebuild \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package TrollStore IPA
        run: |
          mkdir -p build/Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/Xiaote.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/Xiaote-unsigned.ipa
          (cd build && shasum -a 256 Xiaote-unsigned.ipa > Xiaote-unsigned.ipa.sha256)

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Xiaote-iOS17-TrollStore
          path: |
            build/Xiaote-unsigned.ipa
            build/Xiaote-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The runner's proxy drops api.github.com connections; retry the
          # release create and the asset upload instead of failing the tag run.
          for attempt in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
               gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes; then
              break
            fi
            echo "Release create attempt $attempt failed; retrying"
            sleep 5
          done
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" \
                build/Xiaote-unsigned.ipa \
                build/Xiaote-unsigned.ipa.sha256 \
                --clobber; then
              exit 0
            fi
            echo "Release upload attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
