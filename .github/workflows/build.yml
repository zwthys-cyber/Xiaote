name: Build and verify Xiaote

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaote-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Fleet API backend tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Test and vet backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

  test-library:
    name: Tesla protocol tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Checkout pinned app TeslaBLEKeyKit fork
        uses: actions/checkout@v6
        with:
          repository: zwthys-cyber/TeslaBLEKeyKit
          ref: d5da62c003ac6e2e0d8695f910957dd5708c82d7
          path: .ci/TeslaBLEKeyKit

      - name: Run protocol and crypto tests
        working-directory: .ci/TeslaBLEKeyKit
        run: swift test

  build-app:
    name: Build unsigned TrollStore IPA
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify Mac toolchain
        run: |
          xcodebuild -version
          xcodegen --version
          swift --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Xiaote.xcodeproj -scheme Xiaote

      - name: Prepare reproducible simulator devices
        run: python3 scripts/prepare-ios-simulators.py

      - name: Run app and UI regression tests
        run: |
          xcodebuild test \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -destination "platform=iOS Simulator,id=$UI_PHONE_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify compact iPhone UI
        run: |
          xcodebuild test \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -destination "platform=iOS Simulator,id=$UI_SMALL_PHONE_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath SmallScreenResults.xcresult \
            -only-testing:XiaoteUITests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path build/ui-screenshots
          fi
          if [ -d SmallScreenResults.xcresult ]; then
            xcrun xcresulttool export attachments --path SmallScreenResults.xcresult --output-path build/ui-screenshots-small
          fi

      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Xiaote-Simulator-Results
          path: |
            TestResults.xcresult
            SmallScreenResults.xcresult
            build/ui-screenshots
            build/ui-screenshots-small
          retention-days: 7

      - name: Build for physical iPhone without signing
        run: |
          xcodebuild \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package TrollStore IPA
        run: |
          mkdir -p build/Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/Xiaote.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/Xiaote-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Xiaote-iOS17-TrollStore
          path: build/Xiaote-unsigned.ipa
          if-no-files-found: error
